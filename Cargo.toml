[package]
name = "ghubx"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
egui = "0.37.0"
hidapi = "2.6.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.35"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
raw-window-handle = "0.6.2"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
